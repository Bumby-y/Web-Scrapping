[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "web-scraping-crawler"
version = "0.1.0"
description = "Reusable crawl coordination for web-scraping workflows."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
scrapy = ["Scrapy>=2.11,<3"]
playwright = ["scrapy-playwright>=0.0.44,<1; python_version >= '3.10'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
